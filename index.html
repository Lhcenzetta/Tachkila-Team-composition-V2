<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="script.js" defer></script>
    <link rel="stylesheet" href="/css/style.css">

    <title>Tachkila</title>
</head>
<body>
<header class="col-span-full flex flex-wrap items-center justify-between gap-4 border-b border-[#a5c4f7]/30 bg-[#202c40] px-4 py-3 sm:px-6">
    <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-full border border-green-500 bg-green-500/40 text-xl">⚽</div> <h1 class="text-2xl font-extrabold tracking-wide text-white sm:text-3xl">TACHKILA</h1>
    </div>
    <nav id="navbar-sticky" class="flex w-full items-center justify-center md:w-auto">
        <ul class="flex flex-wrap items-center gap-2 rounded-lg border border-[#a5c4f7]/40 p-1 text-sm font-medium sm:gap-4 sm:p-2">
            <li> <a href="/index.html" class="lien-actif block rounded bg-green-600 px-3 py-1.5 text-white transition hover:bg-green-700" aria-current="page">Effectif</a></li>
            <li> <a href="/composition.html" class="block rounded px-3 py-1.5 text-white transition hover:bg-green-600">Composition</a> </li>
            <li> <a href="/matchs.html" class="block rounded px-3 py-1.5 text-white transition hover:bg-green-600">Matchs</a> </li>
        </ul>
    </nav>

    <div class="flex flex-wrap items-center gap-4 text-xs font-bold sm:text-sm">
        <div class="flex items-center gap-1.5 text-orange-400">
            <span class="h-2.5 w-2.5 rounded-full bg-orange-400"></span>GB
        </div>
        <div class="flex items-center gap-1.5 text-blue-400">
            <span class="h-2.5 w-2.5 rounded-full bg-blue-600"></span>DEF
        </div>
        <div class="flex items-center gap-1.5 text-green-400">
            <span class="h-2.5 w-2.5 rounded-full bg-green-400"></span>MIL
        </div>
        <div class="flex items-center gap-1.5 text-red-400">
            <span class="h-2.5 w-2.5 rounded-full bg-red-400"></span>ATT
        </div>
    </div>
</header>

<section class="col-span-full w-full px-4 py-3 sm:px-8">
    <div class="mx-auto flex max-w-[1500px] flex-col gap-3">
    <button id="Btn-add" class="flex h-[45px] w-full items-center justify-center rounded-[14px] bg-green-400 text-lg font-bold transition hover:bg-green-400/80 "> + Ajouter un joueur </button>
        <div class="flex h-11 items-center gap-3 rounded-full border border-slate-600/50 bg-[#0c1628]/80 px-4 backdrop-blur-md transitionfocus-within:border-green-500">
            <input id="searchPlayer" type="text" placeholder="Rechercher un joueur..." class="min-w-0 flex-1 bg-transparent text-sm text-white outline-none placeholder:text-slate-400">
        </div>
        <div class="flex flex-wrap items-center justify-between gap-3">
            <span class="text-[11px] font-semibold uppercase tracking-widest text-slate-400"> Filtrer par poste
            </span>
            <div class="flex max-w-full gap-2 overflow-x-auto">
                <button type="button" class="filter-btn shrink-0 rounded-full bg-green-600 px-4 py-2 text-xs font-semibold text-white transition"> Tous </button>
                <button type="button" class="filter-btn shrink-0 rounded-full border border-slate-600/60 bg-slate-800/50 px-4 py-2 text-xs font-semibold text-slate-300 transition hover:bg-slate-700"> GB </button>
                <button type="button" class="filter-btn shrink-0 rounded-full border border-slate-600/60 bg-slate-800/50 px-4 py-2 text-xs font-semibold text-slate-300 transition hover:bg-slate-700">GB </button>
                <button type="button" class="filter-btn shrink-0 rounded-full border border-slate-600/60 bg-slate-800/50 px-4 py-2 text-xs font-semibold text-slate-300 transition hover:bg-slate-700">GB </button>
                <button type="button" class="filter-btn shrink-0 rounded-full border border-slate-600/60 bg-slate-800/50 px-4 py-2 text-xs font-semibold text-slate-300 transition hover:bg-slate-700">GB </button>
            </div>
        </div>

    </div>
    
</section>

</body>
</html>
