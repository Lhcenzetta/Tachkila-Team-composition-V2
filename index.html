<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="script.js" defer></script>
    <link rel="stylesheet" href="/css/style.css">

    <title>Tachkila</title>
</head>
<body>
<header class="col-span-full flex flex-wrap items-center justify-between gap-4 border-b border-[#a5c4f7]/30 bg-[#202c40] px-4 py-3 sm:px-6">
    <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-full border border-green-500 bg-green-500/40 text-xl">⚽</div> <h1 class="text-2xl font-extrabold tracking-wide text-white sm:text-3xl">TACHKILA</h1>
    </div>
    <nav id="navbar-sticky" class="flex w-full items-center justify-center md:w-auto">
        <ul class="flex flex-wrap items-center gap-2 rounded-lg border border-[#a5c4f7]/40 p-1 text-sm font-medium sm:gap-4 sm:p-2">
            <li> <a href="/index.html" class="lien-actif block rounded bg-green-600 px-3 py-1.5 text-white transition hover:bg-green-700" aria-current="page">Effectif</a></li>
            <li> <a href="/composition.html" class="block rounded px-3 py-1.5 text-white transition hover:bg-green-600">Composition</a> </li>
            <li> <a href="/matchs.html" class="block rounded px-3 py-1.5 text-white transition hover:bg-green-600">Matchs</a> </li>
        </ul>
    </nav>

    <div class="flex flex-wrap items-center gap-4 text-xs font-bold sm:text-sm">
        <div class="flex items-center gap-1.5 text-orange-400">
            <span class="h-2.5 w-2.5 rounded-full bg-orange-400"></span>GB
        </div>
        <div class="flex items-center gap-1.5 text-blue-400">
            <span class="h-2.5 w-2.5 rounded-full bg-blue-600"></span>DEF
        </div>
        <div class="flex items-center gap-1.5 text-green-400">
            <span class="h-2.5 w-2.5 rounded-full bg-green-400"></span>MIL
        </div>
        <div class="flex items-center gap-1.5 text-red-400">
            <span class="h-2.5 w-2.5 rounded-full bg-red-400"></span>ATT
        </div>
    </div>
</header>

<section class="col-span-full w-full px-4 py-3 sm:px-8">
    <div class="mx-auto flex max-w-[1500px] flex-col gap-3">
    <button id="Btn-Ajouter" class="flex h-[45px] w-full items-center justify-center rounded-[14px] bg-green-400 text-lg font-bold transition hover:bg-green-400/80 "> + Ajouter un joueur </button>
        <div class="flex h-11 items-center gap-3 rounded-full border border-slate-600/50 bg-[#0c1628]/80 px-4 backdrop-blur-md transitionfocus-within:border-green-500">
            <input id="searchPlayer" type="text" placeholder="Rechercher un joueur..." class="min-w-0 flex-1 bg-transparent text-sm text-white outline-none placeholder:text-slate-400">
        </div>
        <div class="flex flex-wrap items-center justify-between gap-3">
            <span class="text-[11px] font-semibold uppercase tracking-widest text-slate-400"> Filtrer par poste
            </span>
            <div class="flex max-w-full gap-2 overflow-x-auto">
                <button type="button" class="filter-btn shrink-0 rounded-full bg-green-600 px-4 py-2 text-xs font-semibold text-white transition"> Tous </button>
                <button type="button" class="filter-btn shrink-0 rounded-full border border-slate-600/60 bg-slate-800/50 px-4 py-2 text-xs font-semibold text-slate-300 transition hover:bg-slate-700"> GB </button>
                <button type="button" class="filter-btn shrink-0 rounded-full border border-slate-600/60 bg-slate-800/50 px-4 py-2 text-xs font-semibold text-slate-300 transition hover:bg-slate-700">GB </button>
                <button type="button" class="filter-btn shrink-0 rounded-full border border-slate-600/60 bg-slate-800/50 px-4 py-2 text-xs font-semibold text-slate-300 transition hover:bg-slate-700">GB </button>
                <button type="button" class="filter-btn shrink-0 rounded-full border border-slate-600/60 bg-slate-800/50 px-4 py-2 text-xs font-semibold text-slate-300 transition hover:bg-slate-700">GB </button>
            </div>
        </div>
    </div>
</section>
    <div id="joueur" class="flex ">
        <p class="flex justify-center hidden">Aucun joueur pour le moment</p>
    </div>

    <div id="modaljoueur" class="fixed left-1/2 top-1/2 z-50 hidden w-[calc(100%-24px)] max-w-[640px] max-h-[90dvh] -translate-x-1/2 -translate-y-1/2 flex-col gap-7 overflow-y-auto rounded-[20px] border border-[#34445f] bg-[#1e293b] p-5 text-white shadow-2xl sm:p-8">
        <div class="flex items-center justify-between">
            <h2 id="title" class="text-2xl font-bold"> Ajouter un joueur </h2>
            <button id="btnClose" type="button" class="text-3xl text-slate-400 transition hover:text-white">
                &times;
            </button>
        </div>
        <div class="flex flex-col gap-2">
            <label for="nomplayer" class="font-semibold text-slate-300"> Nom complet </label>
            <input id="nomplayer" type="text" class="h-14 w-full rounded-xl border border-[#475569] bg-[#0f172a] px-4 text-white outline-none transition focus:border-green-500 focus:ring-green-500">
        </div>

        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
            <div class="flex min-w-0 flex-col gap-2">
                <label for="numplayer" class="font-semibold text-slate-300"> Numéro </label>
                <input id="numplayer" type="number" min="1" max="99" class="h-[52px] w-full rounded-xl border border-[#475569] bg-[#0f172a] px-4 text-white outline-none focus:border-green-500">
            </div>
            <div class="flex min-w-0 flex-col gap-2">
                <label for="postplayer" class="font-semibold text-slate-300"> Poste</label>
                <select id="postplayer" name="post" class="h-[52px] w-full rounded-xl border border-[#475569] bg-[#0f172a] px-4 text-white outline-none focus:border-green-500">
                    <option value="" selected disabled> Choisir un poste </option>
                    <option value="Gardien">Gardien</option>
                    <option value="Défenseur">Défenseur</option>
                    <option value="Milieu">Milieu</option>
                    <option value="Attaquant">Buteur</option>
                </select>
            </div>
        </div>
        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
            <div class="flex min-w-0 flex-col gap-2">
                <label for="ageplayer" class="font-semibold text-slate-300"> Âge </label>
                <input id="ageplayer" type="number" min="1" class="h-[52px] w-full rounded-xl  border border-[#475569 bg-[#0f172a] px-4 text-white outline-none focus:border-green-500">
            </div>
            <div class="flex min-w-0 flex-col gap-2">
                <label for="statusplayer" class="font-semibold text-slate-300"> Statut </label>
                <select id="statusplayer" class="h-[52px] w-full rounded-xl border border-[#475569] bg-[#0f172a] px-4 text-white outline-none focus:border-green-500">
                    <option value="En forme">En forme</option>
                    <option value="Blessé">Blessé</option>
                </select>
            </div>
        </div>
        <div class="mt-4 flex justify-end gap-3">
            <button id="Annuler-btn" type="button" class="rounded-xl border border-[#475569] bg-transparent px-5 py-3 font-semibold text-slate-300 transition hover:bg-slate-700"> Annuler </button>
            <button id="save-btn" type="button" class="rounded-xl bg-green-600 px-5 py-3 font-semibold text-white transition hover:bg-green-500"> Enregistrer</button>
        </div>
    </div>

    <div id="modal-confirmation" class="fixed hidden inset-0 flex items-center justify-center bg-black bg-opacity-50">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-sm mx-4 p-6">
                <h3 class="text-lg font-medium text-gray-900">Supprimer</h3>
                <p class="mt-2 text-sm text-gray-500">vous-Êtes sûr ?</p>
                <div class="mt-6 flex justify-end gap-3">
                    <button id="Annuler-confirmation" class="px-4 py-2  text-gray-700 border rounded-md hover:bg-gray-50">
                        Annuler </button>
                    <button id="confirmedelete" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700"> Confirmer
                    </button>
                </div>
            </div>
    </div>
    
    <div class="flex justify-end gap-3 mb-3">
        <button id="prevPlayers" type="button" class="rounded-lg bg-blue-900/70 px-4 py-2 text-white hover:bg-blue-700">
            &#10094;
        </button>
    
        <button id="nextPlayers" type="button" class="rounded-lg bg-blue-900/70 px-4 py-2 text-white hover:bg-blue-700">
            &#10095;
        </button>
    </div>
    <div id="notification" class="fixed right-3 top-3 z-[60] hidden max-w-[calc(100vw-24px)] rounded-xl border-l-4 border-green-500 bg-green-100 p-4 shadow-lg sm:right-6 sm:top-6">
        <p id="message" class="text-green-700"></p>
    </div>
</body>
</html>
